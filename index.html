
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Segnaposto Natale - MARCO</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101820;
  font-family: Arial, sans-serif;
}

#intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  color: white;
  background: linear-gradient(160deg,#10251e,#101820,#3a1717);
}

h1 {
  color: #f2cf79;
  letter-spacing: 2px;
}

button {
  padding: 16px 25px;
  border: 0;
  border-radius: 30px;
  background: #d9b45d;
  font-size: 16px;
  font-weight: bold;
}

#status {
  margin-top: 20px;
  color: #f7d77e;
}

#hint {
  position: fixed;
  z-index: 50;
  bottom: 15px;
  left: 10px;
  right: 10px;
  text-align: center;
  color: white;
  background: #0009;
  padding: 12px;
  border-radius: 12px;
  display: none;
  pointer-events: none;
}

a-scene {
  position: fixed !important;
  inset: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div id="intro">
  <h1>BUON NATALE</h1>
  <p>Il tuo segnaposto prende vita.<br>
  Inquadra il marker Hiro stampato sul segnaposto.</p>
  <button id="start">AVVIA LA FOTOCAMERA</button>
  <div id="status">Pronto</div>
</div>

<div id="hint">Inquadra il marker Hiro</div>

<a-scene
  id="ar-scene"
  embedded
  vr-mode-ui="enabled: false"
  renderer="antialias: true; alpha: true"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
  style="display:none">

  <a-marker preset="hiro">

    <a-entity position="0 0.8 0">

      <a-text
        value="MARCO"
        align="center"
        color="#8a5a12"
        width="5"
        position="0.025 -0.025 -0.02">
      </a-text>

      <a-text
        value="MARCO"
        align="center"
        color="#f7d77e"
        width="5"
        position="0 0 0">
      </a-text>

      <a-text
        value="BUON NATALE"
        align="center"
        color="white"
        width="3"
        position="0 -0.4 0">
      </a-text>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const button = document.getElementById('start');
const intro = document.getElementById('intro');
const status = document.getElementById('status');
const hint = document.getElementById('hint');
const scene = document.getElementById('ar-scene');

let started = false;

button.addEventListener('click', function() {
  if (started) return;

  started = true;
  button.disabled = true;
  status.textContent = 'Avvio realtà aumentata...';

  scene.style.display = 'block';

  scene.addEventListener('camera-init', function() {
    status.textContent = 'Fotocamera attiva';
    hint.textContent = 'Inquadra il marker Hiro';
    hint.style.display = 'block';
  });

  scene.addEventListener('camera-error', function() {
    status.textContent = 'Errore fotocamera. Ricarica la pagina.';
    intro.style.display = 'flex';
    button.disabled = false;
    started = false;
  });

  setTimeout(function() {
    intro.style.display = 'none';
    hint.style.display = 'block';
  }, 1500);
});
</script>

</body>
</html>
