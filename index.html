
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test fotocamera</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h2 { color: #f2cf79; margin-top: 50px; }

button {
  padding: 16px 24px;
  border: 0;
  border-radius: 25px;
  background: #d9b45d;
  font-size: 17px;
  font-weight: bold;
  margin: 20px;
}

video {
  display: none;
  width: 100%;
  height: 75vh;
  object-fit: cover;
  background: black;
}

#status {
  padding: 15px;
  color: #f7d77e;
}
</style>
</head>

<body>

<h2>TEST FOTOCAMERA</h2>

<p>Premi il pulsante per attivare la fotocamera.</p>

<button id="start">APRI FOTOCAMERA</button>

<div id="status">In attesa...</div>

<video id="camera" autoplay muted playsinline></video>

<script>
const button = document.getElementById('start');
const video = document.getElementById('camera');
const status = document.getElementById('status');

button.addEventListener('click', async () => {
  button.disabled = true;
  status.textContent = 'Richiesta fotocamera...';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' }
      },
      audio: false
    });

    video.srcObject = stream;
    video.style.display = 'block';
    video.style.position = 'fixed';
video.style.inset = '0';
video.style.width = '100vw';
video.style.height = '100dvh';
video.style.objectFit = 'contain';
video.style.zIndex = '9999';
video.style.background = 'black';

video.onended = () => {
  status.textContent = 'IL VIDEO È TERMINATO';
};

video.onerror = () => {
  status.textContent = 'ERRORE VIDEO';
};

video.onplaying = () => {
  status.textContent = 'VIDEO IN RIPRODUZIONE';
};

    await video.play();

    status.textContent = 'FOTOCAMERA ATTIVA';
    button.textContent = 'FOTOCAMERA ATTIVA';

  } catch (error) {
    status.textContent = 'ERRORE: ' + error.name + ' - ' + error.message;
    button.disabled = false;
  }
});
</script>

</body>
</html>
