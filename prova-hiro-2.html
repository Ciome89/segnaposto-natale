
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Test AR Hiro 2</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#stato {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 99999;
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  white-space: pre-wrap;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="stato">Pagina caricata. Attendo AR.js...</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="antialias: false; precision: mediump"
  arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
>

  <a-marker preset="hiro">
    <a-box
      position="0 0.5 0"
      material="color: #D4AF37; metalness: 0.7; roughness: 0.3"
    ></a-box>
  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
const stato = document.getElementById("stato");

function messaggio(testo) {
  stato.textContent += "\n" + testo;
}

window.addEventListener("load", () => {
  messaggio("Pagina completamente caricata.");
});

window.addEventListener("camera-init", () => {
  messaggio("OK: AR.js ha avviato la fotocamera.");
});

window.addEventListener("camera-error", (e) => {
  messaggio("ERRORE FOTOCAMERA AR.js:");
  messaggio(e.error ? e.error.message : "Errore non specificato");
});

window.addEventListener("arjs-video-loaded", () => {
  messaggio("Video AR.js inserito nella pagina.");
});

const scena = document.querySelector("a-scene");

scena.addEventListener("loaded", () => {
  messaggio("Scena A-Frame caricata.");
});

scena.addEventListener("renderstart", () => {
  messaggio("Motore grafico avviato.");
});

const marker = document.querySelector("a-marker");

marker.addEventListener("markerFound", () => {
  messaggio("HIRO RICONOSCIUTO!");
});

marker.addEventListener("markerLost", () => {
  messaggio("Marker Hiro perso.");
});

setTimeout(() => {
  messaggio("Controllo dopo 15 secondi completato.");
}, 15000);
</script>

</body>
</html>
